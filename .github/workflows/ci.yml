name: ZIA Trader CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/zia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: requirements.lock
      - name: Install locked CPU dependencies
        run: uv pip sync --system --torch-backend cpu requirements.lock
      - name: Check dependency compatibility
        run: uv pip check --system
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag zia-trader:${{ github.sha }} .
      - name: Smoke runtime imports from image
        run: docker run --rm --entrypoint python zia-trader:${{ github.sha }} -c "from data.news_processor import NewsProcessor; import scripts.ingest_news"
