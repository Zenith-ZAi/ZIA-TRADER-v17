name: ${DOCKER_COMPOSE_PROJECT_NAME:-zia-trader-vps}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.vps}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.vps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.vps}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.vps}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "scripts/initialize_schema.py"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "main.py"]
    environment:
      ENVIRONMENT: production
      AUTO_START_ENGINES: "false"
      DEMO_AUTH_ENABLED: "false"
      AUTH_MODE: env
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in .env.vps}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env.vps}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.vps}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_REQUIRED_FOR_AUTONOMOUS: "true"
      REQUIRE_PERSISTENT_DATABASE: "true"
      REQUIRE_PERSISTENT_REDIS: "true"
      BINANCE_MODE: ${BINANCE_MODE:-simulated}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      BINANCE_BASE_URL_DEMO: ${BINANCE_BASE_URL_DEMO:-https://demo-api.binance.com/api}
      BINANCE_BASE_URL_TESTNET: ${BINANCE_BASE_URL_TESTNET:-https://testnet.binance.vision/api}
      BINANCE_PUBLIC_BASE_URL: ${BINANCE_PUBLIC_BASE_URL:-https://data-api.binance.vision}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_SECRET_KEY: ${BINANCE_DEMO_SECRET_KEY:-}
      SHADOW_MODE_ENABLED: ${SHADOW_MODE_ENABLED:-true}
      AUTONOMOUS_TRADING_ENABLED: ${AUTONOMOUS_TRADING_ENABLED:-false}
      MANUAL_TRADING_ENABLED: ${MANUAL_TRADING_ENABLED:-false}
      LIVE_TRADING_ENABLED: "false"
      LIVE_MODE: "false"
      LIVE_KILL_SWITCH: "true"
      OCO_ENABLED: ${OCO_ENABLED:-true}
      API_PORT: "8000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1}
      CORS_ALLOW_CREDENTIALS: "false"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zia-trader-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - app_models:/app/models
      - app_logs:/app/logs
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      ENVIRONMENT: production
      AUTO_START_ENGINES: "false"
      DEMO_AUTH_ENABLED: "false"
      AUTH_MODE: env
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in .env.vps}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env.vps}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.vps}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_REQUIRED_FOR_AUTONOMOUS: "true"
      REQUIRE_PERSISTENT_DATABASE: "true"
      REQUIRE_PERSISTENT_REDIS: "true"
      BINANCE_MODE: ${BINANCE_MODE:-simulated}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      BINANCE_BASE_URL_DEMO: ${BINANCE_BASE_URL_DEMO:-https://demo-api.binance.com/api}
      BINANCE_BASE_URL_TESTNET: ${BINANCE_BASE_URL_TESTNET:-https://testnet.binance.vision/api}
      BINANCE_PUBLIC_BASE_URL: ${BINANCE_PUBLIC_BASE_URL:-https://data-api.binance.vision}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_SECRET_KEY: ${BINANCE_DEMO_SECRET_KEY:-}
      SHADOW_MODE_ENABLED: ${SHADOW_MODE_ENABLED:-true}
      AUTONOMOUS_TRADING_ENABLED: ${AUTONOMOUS_TRADING_ENABLED:-false}
      MANUAL_TRADING_ENABLED: ${MANUAL_TRADING_ENABLED:-false}
      LIVE_TRADING_ENABLED: "false"
      LIVE_MODE: "false"
      LIVE_KILL_SWITCH: "true"
      OCO_ENABLED: ${OCO_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zia-trader-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    volumes:
      - app_data:/app/data
      - app_models:/app/models
      - app_logs:/app/logs
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  monthly-backtest:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.run_monthly_backtest", "--symbols", "${BACKTEST_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}", "--interval", "${BACKTEST_INTERVAL:-1h}", "--days", "${BACKTEST_DAYS:-31}", "--data-dir", "/app/data/monthly_backtest", "--output", "/app/data/monthly_backtest_result.json"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BINANCE_MODE: simulated
      BINANCE_PUBLIC_BASE_URL: ${BINANCE_PUBLIC_BASE_URL:-https://data-api.binance.vision}
      LIVE_TRADING_ENABLED: "false"
      LIVE_MODE: "false"
      LIVE_KILL_SWITCH: "true"
      AUTONOMOUS_TRADING_ENABLED: "false"
      MANUAL_TRADING_ENABLED: "false"
      SHADOW_MODE_ENABLED: "true"
      FRICTION_ENABLED: "true"
      FRICTION_SLEEP_ENABLED: "false"
    volumes:
      - app_data:/app/data
      - app_models:/app/models
      - app_logs:/app/logs
    depends_on:
      db-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  news-ingest:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/ingest_news.py", "--symbols", "${BACKTEST_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}", "--database-url", "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BINANCE_MODE: simulated
      LIVE_TRADING_ENABLED: "false"
      LIVE_MODE: "false"
      LIVE_KILL_SWITCH: "true"
      AUTONOMOUS_TRADING_ENABLED: "false"
      SHADOW_MODE_ENABLED: "true"
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      BENZINGA_API_KEY: ${BENZINGA_API_KEY:-}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      CRYPTOPANIC_API_KEY: ${CRYPTOPANIC_API_KEY:-}
    volumes:
      - app_data:/app/data
    depends_on:
      db-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  redis_data:
  app_data:
  app_models:
  app_logs:
  prometheus_data:
